#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "domain-watchdog"
name = "Domain Watchdog"
description.en = "Monitor domains via RDAP, track history, acquire them when they expire"
description.fr = "Surveille les noms de domaine via RDAP, suit leur historique et aide à les récupérer à expiration"

version = "1.4.6~ynh1"

maintainers = ["quartztester"]

[upstream]
license = "AGPL-3.0"
code = "https://github.com/maelgangloff/domain-watchdog"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"

multi_instance = false
ldap = false
sso = false
disk = "200M"
ram.build = "1G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Password for the app account created for the admin user."
    help.fr = "Mot de passe du compte applicatif créé pour l'utilisateur admin."
    type = "password"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/maelgangloff/domain-watchdog/archive/refs/tags/v1.4.6.tar.gz"
    sha256 = "da1b484a6145de17d9dae210b813dfe23dd4ebaf1bb6b37f49a66489798fb413"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    redis.default = 0

    [resources.apt]
    packages = "postgresql, redis-server, php8.4-fpm, php8.4-pgsql, php8.4-redis, php8.4-intl, php8.4-xml, php8.4-zip, php8.4-curl, php8.4-apcu, php8.4-opcache"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "22"
