test_format = 1.0

[default]
# Full-domain app (the SPA hardcodes /api in assets/utils/api/index.ts):
# no path to change
exclude = ["change_url"]

    [default.curl_tests]

        main.path = "/"
        main.expect_title = "Domain Watchdog"

        # Real API route (upstream Instance entity, public GET): must answer
        # 200 JSON, not nginx 404 — catches SPA-shell-200 with dead API.
        # /api/login is POST-only (json_login) and answers 405 on GET.
        api_config.path = "/api/config"
        api_config.expect_return_code = 200

        main.auto_test_assets = true
