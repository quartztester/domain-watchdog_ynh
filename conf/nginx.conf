location / {

  # Path to source
  # root, not alias: try_files fallback inside an aliased location is broken
  # (nginx trac #97) — /index.php resolved against the server root, never
  # reached PHP, /api/* answered nginx 404
  root __INSTALL_DIR__/public;

  index index.php;

  # The SPA hardcodes /api; only a root install is supported
  try_files $uri $uri/ /index.php$is_args$args;

  location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;

    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param REMOTE_USER $remote_user;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param SCRIPT_FILENAME $request_filename;
  }
}
